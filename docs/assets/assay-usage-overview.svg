<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Assay project usage overview</title>
  <desc id="desc">Open a local Parquet, CSV, JSONL, or JSON dataset, then inspect and query it, validate and compare it, stage repairs and transforms, and export a reviewed copy. Processing stays on the user's machine by default.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#315f8f"/>
      <stop offset="1" stop-color="#4a7db5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324d" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7894af"/>
    </marker>
  </defs>

  <rect width="1200" height="640" rx="28" fill="url(#background)"/>
  <circle cx="1090" cy="65" r="120" fill="#dce9f6" opacity="0.55"/>
  <circle cx="65" cy="605" r="135" fill="#e3eef8" opacity="0.75"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(64 50)">
      <rect width="52" height="52" rx="14" fill="url(#accent)"/>
      <path d="M14 37 25.8 13 38 37M19.2 27.2h13.5" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="31" font-size="31" font-weight="750" fill="#152b40">Assay</text>
      <text x="70" y="52" font-size="15" font-weight="500" fill="#587087">THE LOCAL-FIRST DATA WORKBENCH</text>
    </g>

    <text x="600" y="150" text-anchor="middle" font-size="27" font-weight="700" fill="#152b40">Understand a dataset before your code does.</text>
    <text x="600" y="180" text-anchor="middle" font-size="16" fill="#587087">Browser, CLI, and VS Code workflows for structured data</text>

    <!-- Input card -->
    <g filter="url(#shadow)">
      <rect x="64" y="230" width="244" height="246" rx="20" fill="#fff" stroke="#c9d8e7"/>
    </g>
    <rect x="64" y="230" width="244" height="7" rx="3.5" fill="#6c91b8"/>
    <g transform="translate(88 257)">
      <rect width="45" height="54" rx="7" fill="#eef4fa" stroke="#8faac5"/>
      <path d="M29 1v14h14M10 26h25M10 35h25M10 44h17" fill="none" stroke="#466c92" stroke-width="2.3" stroke-linecap="round"/>
      <text x="59" y="23" font-size="13" font-weight="700" fill="#4a6b89">1 · OPEN</text>
      <text x="59" y="46" font-size="20" font-weight="700" fill="#152b40">Local data</text>
    </g>
    <g font-size="15" fill="#344d64">
      <text x="88" y="344">Parquet  ·  CSV  ·  JSONL</text>
      <text x="88" y="371">JSON  ·  NDJSON</text>
    </g>
    <rect x="88" y="403" width="196" height="42" rx="9" fill="#edf4fb" stroke="#a9bfd5"/>
    <text x="186" y="429" text-anchor="middle" font-size="14" font-weight="650" fill="#294f74">Open a data file…</text>

    <!-- Workbench card -->
    <g filter="url(#shadow)">
      <rect x="374" y="211" width="452" height="284" rx="22" fill="#fff" stroke="#b9cde0"/>
    </g>
    <rect x="374" y="211" width="452" height="7" rx="3.5" fill="url(#accent)"/>
    <text x="401" y="253" font-size="13" font-weight="700" fill="#4a6b89">2 · WORK LOCALLY</text>
    <text x="401" y="284" font-size="22" font-weight="750" fill="#152b40">Explore, check, and improve</text>

    <g transform="translate(401 310)">
      <g>
        <rect width="184" height="64" rx="12" fill="#f4f8fc" stroke="#cfdeeb"/>
        <circle cx="25" cy="25" r="10" fill="#dbeaf7"/>
        <path d="M19 25h12M25 19v12" stroke="#315f8f" stroke-width="2.4" stroke-linecap="round"/>
        <text x="45" y="25" font-size="15" font-weight="700" fill="#213b53">Inspect &amp; profile</text>
        <text x="45" y="46" font-size="12.5" fill="#60798f">schema, grid, nested data</text>
      </g>
      <g transform="translate(210)">
        <rect width="184" height="64" rx="12" fill="#f4f8fc" stroke="#cfdeeb"/>
        <circle cx="25" cy="25" r="10" fill="#dbeaf7"/>
        <path d="m19 25 4 4 8-9" fill="none" stroke="#315f8f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="45" y="25" font-size="15" font-weight="700" fill="#213b53">Query &amp; validate</text>
        <text x="45" y="46" font-size="12.5" fill="#60798f">SQL and data contracts</text>
      </g>
      <g transform="translate(0 82)">
        <rect width="184" height="64" rx="12" fill="#f4f8fc" stroke="#cfdeeb"/>
        <circle cx="25" cy="25" r="10" fill="#dbeaf7"/>
        <path d="M18 22h14M18 28h10" stroke="#315f8f" stroke-width="2.4" stroke-linecap="round"/>
        <text x="45" y="25" font-size="15" font-weight="700" fill="#213b53">Compare &amp; review</text>
        <text x="45" y="46" font-size="12.5" fill="#60798f">confirmed-key dataset diffs</text>
      </g>
      <g transform="translate(210 82)">
        <rect width="184" height="64" rx="12" fill="#f4f8fc" stroke="#cfdeeb"/>
        <circle cx="25" cy="25" r="10" fill="#dbeaf7"/>
        <path d="m20 30 10-10 3 3-10 10-5 1z" fill="none" stroke="#315f8f" stroke-width="2.1" stroke-linejoin="round"/>
        <text x="45" y="25" font-size="15" font-weight="700" fill="#213b53">Repair &amp; transform</text>
        <text x="45" y="46" font-size="12.5" fill="#60798f">stage reversible changes</text>
      </g>
    </g>

    <!-- Output card -->
    <g filter="url(#shadow)">
      <rect x="892" y="230" width="244" height="246" rx="20" fill="#fff" stroke="#c9d8e7"/>
    </g>
    <rect x="892" y="230" width="244" height="7" rx="3.5" fill="#6c91b8"/>
    <g transform="translate(916 257)">
      <circle cx="25" cy="27" r="24" fill="#edf6ef" stroke="#9fc0a5"/>
      <path d="m14 27 8 8 15-17" fill="none" stroke="#39704a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="62" y="23" font-size="13" font-weight="700" fill="#4a6b89">3 · DELIVER</text>
      <text x="62" y="46" font-size="20" font-weight="700" fill="#152b40">Trusted output</text>
    </g>
    <g font-size="15" fill="#344d64">
      <text x="916" y="344">Export a new dataset copy</text>
      <text x="916" y="371">or generate review artifacts</text>
    </g>
    <rect x="916" y="403" width="196" height="42" rx="9" fill="#eef7f0" stroke="#acd0b2"/>
    <text x="1014" y="429" text-anchor="middle" font-size="14" font-weight="650" fill="#346244">Original file stays unchanged</text>

    <path d="M322 352h36" fill="none" stroke="#7894af" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M842 352h34" fill="none" stroke="#7894af" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(238 540)">
      <rect width="724" height="58" rx="29" fill="#203c56"/>
      <path d="M35 28v-7a10 10 0 0 1 20 0v7M31 28h28v19H31z" fill="none" stroke="#bcd5eb" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="45" cy="37" r="2.2" fill="#bcd5eb"/>
      <text x="78" y="28" font-size="17" font-weight="700" fill="#fff">Your data stays on your machine by default</text>
      <text x="78" y="47" font-size="13" fill="#c9dbea">Powered by DuckDB-WASM for browser-native local execution</text>
    </g>
  </g>
</svg>
