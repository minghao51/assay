format: assay-dcr
version: 1
base:
  datasetId: dataset-a
  versionId: version-a-1
  schemaFingerprint:
    algorithm: assay-schema-fingerprint-v1
    value: fp-a-0001
  materialization:
    node: src_orders
candidate:
  datasetId: dataset-a
  versionId: version-a-2
  schemaFingerprint:
    algorithm: assay-schema-fingerprint-v1
    value: fp-a-0002
  materialization:
    export: exports/run-2/out.parquet
deltas:
  rowDiff:
    keys: [ order_id ]
    sampleLimit: 20
    rowCountA: 1
    rowCountB: 1
    aspects:
      - aspect: added
        count: 1
        samples:
          - side: B
            rowKey: base:some-anchor#41
      - aspect: removed
        count: 0
        samples: []
      - aspect: changed
        count: 0
        samples: []
privacyFindings:
  status: not-computed
  disclosure: "Privacy findings were not computed: this build has no local privacy-analysis producer (ADR 0046, ruling D17-Q6)."
