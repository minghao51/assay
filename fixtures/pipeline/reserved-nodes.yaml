version: 1
pipeline: reserved_surface
nodes:
  clean:
    type: sql
    inputs: [ raw ]
    sql: SELECT * FROM raw
  compare:
    type: diff
    against: raw
    input: clean
  gate:
    type: validate
    input: clean
    contract: contracts/clean.yaml
  out:
    type: publish
    input: clean
    requires: [ gate ]
  raw:
    type: source
    source:
      kind: table
      table: raw_input
