version: 1
pipeline: customer_portfolio

nodes:
  customers:
    type: source
    source:
      kind: file
      path: ./customers.parquet

  sg_customers:
    type: transform
    inputs: [customers]
    operation:
      filter:
        predicates:
          - column: country
            operator: equals
            value: SG

  policies:
    type: source
    source:
      kind: file
      path: ./policies.parquet

  customer_policies:
    type: transform
    inputs: [sg_customers, policies]
    operation:
      join:
        left: sg_customers
        right: policies
        on: [customer_id]

  portfolio:
    type: sql
    inputs: [customer_policies]
    sql: |
      SELECT customer_id, SUM(premium) AS total_premium
      FROM customer_policies
      GROUP BY customer_id

  quality:
    type: validate
    input: portfolio
    contract: contracts/portfolio.yaml

  output:
    type: publish
    input: portfolio
    requires: [quality]
