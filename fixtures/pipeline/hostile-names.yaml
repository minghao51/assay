version: 1
pipeline: 'pipeline with spaces'

nodes:
  '__proto__':
    type: source
    source:
      kind: file
      path: ./a.parquet

  '1':
    type: transform
    inputs: ['__proto__']
    operation:
      filter:
        expression: 'x = 1'
        '__proto__':
          polluted: true

  'weird "quoted" key':
    type: sql
    inputs: ['1', '__proto__']
    sql: SELECT 1

  'ünï':
    type: publish
    input: 'weird "quoted" key'
    requires: ['1']

  'assay_overlay_ord':
    type: diff
    config:
      against: 'ünï'
      note: 'reserved namespace probe'
