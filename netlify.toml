# Netlify deployment for the Assay telemetry collector (ADR 0053; operator
# contract docs/engineering/07-telemetry-collector.md §5).
#
# This site exists to host exactly ONE function —
# `POST /.netlify/functions/collect`. It is NOT the Assay web app: the app is
# built and served elsewhere.
#
# This file is the base-directory-root variant of `netlify/netlify.toml`; the
# two describe the same site and are kept textually parallel. Read that file for
# the full contract — in particular:
#
#   * `functions` points at `netlify/dist`, the PRE-BUNDLED artefact written by
#     `pnpm collector:build` (scripts/build-collector.mjs), not at the
#     `netlify/functions` TypeScript source. A v2 Netlify function forces the
#     `nft` tracer, which leaves `@assay/telemetry` external and ships only its
#     `package.json` (`exports` → `src/index.ts`, which Netlify does not ship),
#     so the deployed function 502s with ERR_MODULE_NOT_FOUND even though the
#     deploy job is green. Pre-bundling inlines the package and removes the
#     runtime resolution entirely.
#   * `dist/` is git-ignored build output. Nothing deploys correctly until
#     `pnpm collector:build` has run in the workspace: the CI workflow runs it
#     in both the validate and the deploy job.
#   * no `[build] command`: the deploy workflow builds and then deploys, so the
#     deploy step never needs the monorepo's build graph. A Git-integration
#     build (a push triggering Netlify directly) must run
#     `pnpm install --frozen-lockfile && pnpm collector:build` as its command,
#     and must fail rather than ship an empty functions directory.
#
# ## Where the deployed URL goes
#
# The only link between the two is a single build-time variable, set when the
# app is built (apps/web/vite.config.ts inlines it, and the stock build — with
# it unset — stays inert):
#
#   ASSAY_TELEMETRY_ENDPOINT=https://<site>/.netlify/functions/collect
#
# Optional companion: `ASSAY_TELEMETRY_TOKEN` (sent as `authorization: Bearer`;
# the contract calls it a write-only ingest token). It is *not* authentication:
# the value ships to every browser that loads the app, so it is public. The
# function compares it, when the Netlify site variable
# `ASSAY_TELEMETRY_INGEST_TOKEN` is set, against that variable with a timing-safe
# comparison and refuses a mismatch with `401 unauthorized` — a spam filter, not
# a security boundary. Leave the site variable unset and the check is skipped
# (today's open behaviour); both variables are configured in the Netlify site
# environment, never as repository secrets, and neither is ever logged.
# Nothing else configures the endpoint: no default URL is baked into the source, and the
# public disclosure copy (docs/telemetry-disclosure.md) plus the endpoint-free
# build both key off this same variable. Do not add a second way to set it.
#
# Reverse direction: the deployed function's URL is derived from the site name,
# so the variable must be set to *that* site's URL. Deploy first, then build the
# app with it. A typo on either side is silent — the app sends nothing, and the
# function receives nothing.

[build]
  # No build command: see the header. `publish` is a checked-in placeholder and
  # `functions` is the pre-bundled output of `pnpm collector:build`.
  publish = "netlify/publish"
  functions = "netlify/dist"

# Nothing the collector returns may be cached: a cached 202/4xx would hide a
# refusal from the client that must drop the batch.
[[headers]]
  for = "/.netlify/functions/collect"
  [headers.values]
    Cache-Control = "no-store"
