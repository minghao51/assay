# Local composite action (audit au2-1): the sha256-pinned DuckDB CLI installer
# was duplicated verbatim in the verify and e2e CI jobs; a single definition
# means the pinned URL/checksum can never drift between lanes.
#
# Version is pinned to the generator version recorded in
# fixtures/parquet/manifest.json (v1.5.5); official release asset,
# checksum-verified (R13 verified download).
name: Install DuckDB CLI (sha256-pinned)
description: Installs DuckDB CLI v1.5.5 with sha256 verification
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        curl -sSfL -o /tmp/duckdb_cli.zip \
          "https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip"
        echo "08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05  /tmp/duckdb_cli.zip" | sha256sum --check -
        unzip -o /tmp/duckdb_cli.zip -d /tmp/duckdb_cli
        sudo install -m 0755 /tmp/duckdb_cli/duckdb /usr/local/bin/duckdb
        duckdb --version
