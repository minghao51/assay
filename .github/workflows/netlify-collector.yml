# Assay telemetry collector — validate always, deploy the Netlify function from
# `main`, then prove the deployed endpoint answers (ADR 0053; operator contract
# docs/engineering/07-telemetry-collector.md §5; successor queue §15.2).
#
# STATUS 2026-11-27 — DEPLOYED AND PROBED. Recording the two things that were
# learned the hard way, because both looked like "it works":
#
# 1. Netlify's monorepo detection runs BEFORE `NETLIFY_SITE_ID` is honoured, so
#    from the repository root the CLI aborts with `Projects detected: @assay/…`.
#    Both jobs that touch the CLI therefore run it with
#    `working-directory: netlify` (a directory deliberately outside the pnpm
#    workspace) and pass `--site "$NETLIFY_SITE_ID"` explicitly.
# 2. A **v2** Netlify function forces the `nft` dependency tracer —
#    `node_bundler = "esbuild"` is ignored — and nft leaves the workspace
#    specifier external: the deployed bundle keeps
#    `import … from "@assay/telemetry"` and ships only the `node_modules`
#    symlink plus `packages/telemetry/package.json`, whose `exports` points at
#    `packages/telemetry/src/index.ts` — a file Netlify does not ship. That
#    deploy is GREEN and the endpoint 502s with `ERR_MODULE_NOT_FOUND`.
#
# Hence: the function is pre-bundled by `pnpm collector:build`
# (scripts/build-collector.mjs, esbuild) into ONE self-contained file,
# `netlify/dist/collect.mjs`, that inlines `@assay/telemetry`; the Netlify
# functions setting points at `netlify/dist`, so nft has nothing to trace and
# `netlify/functions/collect.test.ts` cannot be deployed as a second function.
# The package's validator/allowlist/caps stay the single source of truth — the
# schema is compiled in, never copied.
#
# The validate job builds and proves the artefact on every PR and push (it is
# imported from a temporary directory with no node_modules reachable, then
# driven through the contract's accept/refuse paths). The deploy job rebuilds
# it, deploys, and then PROBES THE LIVE ENDPOINT over HTTP — a green deploy is
# not the acceptance; `--probe` is, because a 502 is invisible to the deploy
# step itself.
#
# 3. (2026-11-27, run 45992312947) `netlify deploy --json` prints
#    PRETTY-PRINTED, MULTI-LINE JSON. The step used to extract the payload with
#    `grep -a '^{' | tail -n 1`, which only works for compact one-line JSON: it
#    captured the lone opening brace, `jq` refused it, and the step failed with
#    "the CLI printed no site URL" AFTER a deploy that had succeeded. The probe
#    step then never ran. `url` was a flat top-level key all along — the SHAPE
#    was wrong, not the key. The payload is now read by
#    `scripts/netlify-deploy-url.mjs` (unit-tested against that run's exact log
#    shape, `scripts/netlify-deploy-url.test.mjs`), and STDOUT/STDERR are kept
#    apart so the deploy's own exit status is real rather than `tee`'s.
#
# The cheap half runs on every PR and every push with no path filter, so the
# collector cannot rot unnoticed. The deploy half runs only on `main` when the
# collector, its build script, its dependency inputs or this file changed, or
# when dispatched by hand.
#
# 4. (2026-11-27, ADR 0054) **This workflow is the ONLY writer to the site.** The
#    site had two writers, and the second silently undid the first: Netlify's Git
#    integration rebuilt `main` on every push with no `[build] command`, so it
#    published the placeholder `publish` directory with an EMPTY functions
#    directory and replaced this workflow's deploy. The canonical endpoint then
#    answered 404 for 72 minutes behind a green Netlify build. The Git integration
#    is disconnected by decision — do not reconnect it. Both `netlify.toml` files
#    carry an inert `[build] command` so that a future reconnect rebuilds the
#    function instead of re-arming the trap.
#
# 5. `verify-production` asks the CANONICAL URL on every push to `main`, whether or
#    not this run deployed anything. The deploy-time probe only proves the bytes
#    that run just shipped; it cannot see production drifting afterwards (another
#    deploy, a manual `netlify deploy`, a deleted function). That job is the alarm
#    for this class, and it reads its URL from the repository VARIABLE
#    `ASSAY_COLLECTOR_URL` — not from a secret, never hardcoded here.
name: Telemetry collector (Netlify Functions)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: reading the repository is all either job needs. Deployment
# authenticates with repository secrets, never with the GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned deliberately: a floating CLI is a supply-chain and reproducibility
  # problem in the one step that holds a deploy token. Bump this in the same
  # commit that records the run which used the new version.
  NETLIFY_CLI_VERSION: 27.20.1

jobs:
  validate:
    name: typecheck / lint / test / bundle the collector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same command the repo gate runs (`pnpm typecheck` ends with it): the
      # root tsconfig includes `netlify/functions/**`, so the function and its
      # test are typechecked against the real `@assay/telemetry` schema.
      - name: Typecheck the collector
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Lint the collector
        run: pnpm exec eslint netlify

      - name: Unit-test the collector
        run: pnpm exec vitest run --project node netlify

      # The deployable artefact is built HERE too, on every PR and push, so the
      # bundling cannot rot: this fails if the bundle leaves any non-builtin
      # import, or if the built file does not answer the contract probes when
      # imported from a temporary directory with no node_modules reachable.
      - name: Build and prove the deployable bundle
        run: pnpm collector:build

  deploy:
    name: deploy collector (a missing secret is a failure, not a pass)
    needs: validate
    # Push-to-main only (plus manual dispatch): a PR never deploys.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the relevance check below diffs the pushed range.
          fetch-depth: 0

      # Deploy when the collector, the bundle script, its dependency inputs or
      # this workflow changed. Anything it cannot prove irrelevant (a forced
      # push, an unknown base) counts as relevant — an unnecessary deploy is
      # harmless, a skipped one hides a change.
      - name: Decide whether this push needs a deploy
        id: relevance
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || \
             [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if changed="$(git diff --name-only "$BEFORE" HEAD -- \
              netlify scripts/build-collector.mjs scripts/netlify-deploy-url.mjs \
              package.json pnpm-lock.yaml \
              .github/workflows/netlify-collector.yml)"; then
            if [ -n "$changed" ]; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Collector deploy skipped::this push changed nothing the collector deploys"
            fi
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Collector deploy relevance unknown::could not diff $BEFORE..HEAD; deploying to be safe"
          fi

      # The deploy needs esbuild (the bundle) and the schema source it inlines.
      - name: Install the workspace
        if: steps.relevance.outputs.deploy == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        if: steps.relevance.outputs.deploy == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        if: steps.relevance.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      # Rebuild and re-prove here rather than trusting the validate job's
      # artefact (jobs do not share a filesystem). The proof also prints the
      # sha256 of the exact bytes this deploy ships.
      - name: Build and prove the deployable bundle
        if: steps.relevance.outputs.deploy == 'true'
        run: pnpm collector:build

      # Secrets are unavailable to a job-level `if`, so they are checked here.
      # The unconfigured case FAILS deliberately. A skipped deploy step under a
      # green job is indistinguishable at a glance from a real deploy, and the
      # whole point of this workflow is that "the collector exists" must never
      # be assumed: a red job named "deploy collector" cannot be misread. The
      # message and the job summary carry no secret and no endpoint — only
      # whether the two named secrets exist.
      - name: Deploy the collector function
        id: deploy
        if: steps.relevance.outputs.deploy == 'true'
        working-directory: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            {
              echo "## Collector NOT deployed"
              echo
              echo "This job had a deploy to do, but \`NETLIFY_AUTH_TOKEN\` and/or"
              echo "\`NETLIFY_SITE_ID\` are not configured as repository secrets."
              echo
              echo "**No deployment happened.** Create the Netlify site for the collector,"
              echo "add both secrets, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Collector NOT deployed::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID are not configured; nothing was deployed."
            exit 1
          fi
          # `working-directory: netlify` keeps the CLI out of the pnpm workspace
          # root, where `@netlify/build-info` detects 20 projects and aborts
          # before the site id is read. `--site` states the site anyway, so the
          # command cannot depend on a linked directory.
          # Exactly one file, so exactly one function ships — the unit suite
          # (`functions/collect.test.ts`) sits in the source directory and can
          # never be bundled as a second function.
          if ! test -f dist/collect.mjs; then
            echo "::error title=Collector NOT deployed::netlify/dist/collect.mjs is missing; nothing was deployed."
            exit 1
          fi
          if [ "$(ls dist | wc -l)" -ne 1 ]; then
            echo "::error title=Collector NOT deployed::netlify/dist must hold exactly one function file."
            ls -l dist
            exit 1
          fi
          # `--json` prints the deploy result on STDOUT; `npx` warnings and CLI
          # progress go to STDERR. Keeping the streams apart is what makes the
          # payload parseable and the deploy's exit status real — a `| tee`
          # pipeline reports tee's status, so a failed deploy used to surface
          # only as "no site URL". Both streams are still echoed verbatim below.
          log="$RUNNER_TEMP/netlify-deploy.log"
          payload="$RUNNER_TEMP/netlify-deploy.json"
          status=0
          npx --yes "netlify-cli@${NETLIFY_CLI_VERSION}" deploy --prod \
            --site "$NETLIFY_SITE_ID" \
            --message "assay collector ${GITHUB_SHA}" \
            --json >"$payload" 2>"$log" || status=$?
          cat "$log"
          cat "$payload"
          if [ "$status" -ne 0 ]; then
            echo "::error title=Collector deploy failed::netlify deploy exited $status; nothing was verified and the probe does not run."
            exit 1
          fi
          # The payload is pretty-printed multi-line JSON: the reader finds the
          # LAST parsable object across both files (so a stray progress line on
          # either stream cannot defeat it). It fails closed with a reason on
          # stderr instead of yielding an empty URL.
          if ! fields="$(node "$GITHUB_WORKSPACE/scripts/netlify-deploy-url.mjs" "$log" "$payload")"; then
            echo "::error title=Collector deploy result unreadable::the deploy exited 0 but its output yielded no usable site URL, so the probe cannot run. The raw output is in the step log above."
            exit 1
          fi
          IFS=$'\t' read -r url site_name deploy_id <<<"$fields"
          if [ -z "$url" ]; then
            echo "::error title=Collector deploy URL unknown::the CLI printed no site URL; the probe step cannot run."
            exit 1
          fi
          echo "site: ${site_name} · deploy: ${deploy_id}"
          {
            echo "## Collector deployed"
            echo
            echo "- Site: \`$url\`"
            echo "- Endpoint for the app build: \`ASSAY_TELEMETRY_ENDPOINT=$url/.netlify/functions/collect\`"
            echo "- Function: \`netlify/dist/collect.mjs\` (self-contained; \`@assay/telemetry\` inlined)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The acceptance for this workflow. A green deploy step is NOT evidence
      # the function runs: the bundling failure this workflow works around
      # shipped a green deploy and a 502 on first request. Retries are bounded
      # (3 attempts) to cover deploy propagation, never to mask a 502.
      - name: Prove the deployed endpoint answers
        if: steps.relevance.outputs.deploy == 'true'
        env:
          COLLECTOR_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in 1 2 3; do
            echo "::group::probe attempt $attempt"
            if node scripts/build-collector.mjs --probe "$COLLECTOR_URL/.netlify/functions/collect"; then
              echo "::endgroup::"
              echo "::notice title=Collector verified::the live endpoint answers the contract probes"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning title=Collector probe failed::attempt $attempt of 3; retrying in 5s"
            sleep 5
          done
          echo "::error title=Collector probe failed::the deploy may be green, but the live endpoint does not answer the contract"
          exit 1

  # The drift alarm (ADR 0054). Deliberately NOT `needs: deploy`-gated on success:
  # it runs after the deploy job settles whatever the outcome, because "this run
  # deployed nothing" and "this run failed to deploy" are exactly when production
  # drifting would otherwise go unnoticed. It never deploys, never authenticates
  # and reads no secret — the probe is public HTTP.
  verify-production:
    name: verify production still serves the collector
    needs: [validate, deploy]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `--probe` reads MAX_REQUEST_BYTES and the caps from the built artefact —
      # the same file the deploy ships — so the numbers are never retyped here.
      - name: Build the artefact the probe measures against
        run: pnpm collector:build

      - name: Probe the canonical endpoint
        env:
          SITE_URL: ${{ vars.ASSAY_COLLECTOR_URL }}
        run: |
          # The variable is the SITE origin (`https://<site>.netlify.app`). A value
          # that already ends with the function path is accepted too, so a
          # reasonable misconfiguration cannot produce a doubled path and a
          # confusing 404. Absent is a FAILURE, not a skip: a silent skip here is
          # indistinguishable from "production is fine", which is the whole
          # failure mode this job exists to remove.
          if [ -z "$SITE_URL" ]; then
            echo "::error title=Collector URL not configured::set the repository VARIABLE ASSAY_COLLECTOR_URL to the collector site origin (for example https://assay-dataworkbench.netlify.app); this job cannot verify production without it."
            exit 1
          fi
          site_url="${SITE_URL%/}"
          case "$site_url" in
            */.netlify/functions/collect) endpoint="$site_url" ;;
            *) endpoint="$site_url/.netlify/functions/collect" ;;
          esac
          # Bounded retries cover a just-settled deploy propagating to the CDN;
          # they never mask a 404 or a 502, which reproduce on every attempt.
          for attempt in 1 2 3; do
            echo "::group::probe attempt $attempt"
            if node scripts/build-collector.mjs --probe "$endpoint"; then
              echo "::endgroup::"
              echo "::notice title=Production verified::the canonical endpoint answers the contract probes"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning title=Production probe failed::attempt $attempt of 3; retrying in 5s"
            sleep 5
          done
          echo "::error title=Production does not serve the collector::$endpoint did not answer the contract. Production has drifted from this repository: check the site's deploy history for a deploy this workflow did not make (a reconnect of Netlify's Git integration, a manual deploy), and see ADR 0054."
          exit 1
