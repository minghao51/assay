name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege (audit AR-R2): the GITHUB_TOKEN never needs write here.
# Declared at the workflow level *and* repeated per job (explicit job-level
# wins) so a future job that forgets its own block still inherits the safe
# default rather than the repository default.
permissions:
  contents: read

# Cancel superseded runs on the same ref (audit AR-R4b): a new push to a PR
# cancels the in-flight run instead of paying for two full verify+e2e lanes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    # Audit AR-R3: measured ≈3 min. 20 min ≈ 6× leaves room for a cold turbo
    # cache and registry hiccups, while killing a hung job far short of the
    # 6-hour default ceiling.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 # reads packageManager from package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # Turbo's local cache defaults to `<repo>/.turbo/cache` on CI (there is no
      # shared-worktree cache like the agent lanes have). Task results are
      # content-hashed, so restoring the newest cache for this OS is safe —
      # turbo re-validates every task hash before replaying.
      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Pinned to the generator version recorded in fixtures/parquet/manifest.json
      # (v1.5.5); official release asset, checksum-verified (R13 verified
      # download). Shared by both lanes via the local composite action (au2-1)
      # so the pinned URL/checksum cannot drift between jobs.
      - name: Install DuckDB CLI v1.5.5 (sha256-pinned)
        uses: ./.github/actions/install-duckdb

      # Committed fixtures must reproduce bit-identically under the pinned CLI
      # (ADR 0038); drift means fixtures changed without a deliberate manifest update.
      - name: Regenerate golden Parquet fixtures and verify zero drift
        run: |
          bash fixtures/parquet/generate.sh
          git diff --exit-code fixtures/parquet/
          [ -z "$(git status --porcelain fixtures/parquet/)" ]

      - run: pnpm lint

      # au2-1: both checks pass today but were honor-system — wire them so a
      # missed prettier pass (q-5 lesson) or an ADR-index edit fails CI instead
      # of waiting for a human to run the `:*:check` scripts.
      - run: pnpm format:check

      - run: pnpm adr:index:check

      - run: pnpm typecheck

      - run: pnpm test

      # f-6: coverage thresholds are enforced here, not honor-system (the
      # au2-1 lesson). Kept as its own step so plain `pnpm test` stays fast.
      - run: pnpm test:coverage

      - run: pnpm build

      # ar-5's done-when "enforcement" leg — previously manual-only (audit
      # au2-1): proves the publishable tsc artifacts and the CLI bin install
      # and run from packed tarballs under plain node (~8 s locally).
      - name: Publish-consumer smoke (ar-5)
        run: node apps/cli/scripts/pack-consumer-smoke.mjs

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    # Audit AR-R3: measured ≈7.5 min. 45 min ≈ 6× is headroom for the red-run
    # retry budget (worst case ≈7.5 + 2×7.5 ≈ 22.5 min) plus a cold browser
    # download, while killing a stuck browser/webServer far short of the
    # 6-hour default ceiling.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Browser builds are locked to the resolved Playwright version, so the
      # cache key is that version, read cheaply from the installed package
      # (`node -p` after install). A Playwright bump changes the key and
      # triggers a fresh download; the lockfile hash would be a broader (and
      # unnecessarily invalidating) proxy.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      # Same pinned CLI as the verify job, via the shared composite action
      # (au2-1); available to e2e steps that generate large on-demand fixtures
      # (never committed — ADR 0038).
      - name: Install DuckDB CLI v1.5.5 (sha256-pinned)
        uses: ./.github/actions/install-duckdb

      - run: pnpm test:e2e

      # Audit AR-R4b: failure-only debug artifacts. On a red run the retries
      # leave traces/screenshots/videos in test-results/; the HTML report dir
      # is listed too in case a reporter emits it. Short retention keeps
      # storage bounded.
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-artifacts
          path: |
            test-results
            playwright-report
          retention-days: 5
          if-no-files-found: ignore
