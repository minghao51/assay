name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege (audit AR-R2): the GITHUB_TOKEN never needs write here.
# Declared at the workflow level *and* repeated per job (explicit job-level
# wins) so a future job that forgets its own block still inherits the safe
# default rather than the repository default.
permissions:
  contents: read

# Cancel superseded runs on the same ref (audit AR-R4b): a new push to a PR
# cancels the in-flight run instead of paying for two full verify+e2e lanes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    # Audit AR-R3: measured ≈3 min. 20 min ≈ 6× leaves room for a cold turbo
    # cache and registry hiccups, while killing a hung job far short of the
    # 6-hour default ceiling.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 # reads packageManager from package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # Turbo's local cache defaults to `<repo>/.turbo/cache` on CI (there is no
      # shared-worktree cache like the agent lanes have). Task results are
      # content-hashed, so restoring the newest cache for this OS is safe —
      # turbo re-validates every task hash before replaying.
      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Pinned to the generator version recorded in fixtures/parquet/manifest.json
      # (v1.5.5); official release asset, checksum-verified (R13 verified
      # download). Shared by both lanes via the local composite action (au2-1)
      # so the pinned URL/checksum cannot drift between jobs.
      - name: Install DuckDB CLI v1.5.5 (sha256-pinned)
        uses: ./.github/actions/install-duckdb

      # Committed fixtures must reproduce bit-identically under the pinned CLI
      # (ADR 0038); drift means fixtures changed without a deliberate manifest update.
      - name: Regenerate golden Parquet fixtures and verify zero drift
        run: |
          bash fixtures/parquet/generate.sh
          git diff --exit-code fixtures/parquet/
          [ -z "$(git status --porcelain fixtures/parquet/)" ]

      - run: pnpm lint

      # au2-1: both checks pass today but were honor-system — wire them so a
      # missed prettier pass (q-5 lesson) or an ADR-index edit fails CI instead
      # of waiting for a human to run the `:*:check` scripts.
      - run: pnpm format:check

      - run: pnpm adr:index:check

      # f-11: a broken relative doc link (au2-4's four) fails CI here instead
      # of waiting for a reader to notice the dead target.
      - run: pnpm docs:links:check

      - run: pnpm typecheck

      - run: pnpm test

      # f-6: coverage thresholds are enforced here, not honor-system (the
      # au2-1 lesson). Kept as its own step so plain `pnpm test` stays fast.
      - run: pnpm test:coverage

      - run: pnpm build

      # ar-5's done-when "enforcement" leg — previously manual-only (audit
      # au2-1): proves the publishable tsc artifacts and the CLI bin install
      # and run from packed tarballs under plain node (~8 s locally).
      - name: Publish-consumer smoke (ar-5)
        run: node apps/cli/scripts/pack-consumer-smoke.mjs

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    # Audit AR-R3: measured ≈7.5 min. 45 min ≈ 6× is headroom for the red-run
    # retry budget (worst case ≈7.5 + 2×7.5 ≈ 22.5 min) plus a cold browser
    # download, while killing a stuck browser/webServer far short of the
    # 6-hour default ceiling.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Browser builds are locked to the resolved Playwright version, so the
      # cache key is that version, read cheaply from the installed package
      # (`node -p` after install). A Playwright bump changes the key and
      # triggers a fresh download; the lockfile hash would be a broader (and
      # unnecessarily invalidating) proxy.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      # Same pinned CLI as the verify job, via the shared composite action
      # (au2-1); available to e2e steps that generate large on-demand fixtures
      # (never committed — ADR 0038).
      - name: Install DuckDB CLI v1.5.5 (sha256-pinned)
        uses: ./.github/actions/install-duckdb

      - run: pnpm test:e2e

      # Audit AR-R4b: failure-only debug artifacts. On a red run the retries
      # leave traces/screenshots/videos in test-results/; the HTML report dir
      # is listed too in case a reporter emits it. Short retention keeps
      # storage bounded.
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-artifacts
          path: |
            test-results
            playwright-report
          retention-days: 5
          if-no-files-found: ignore

  # ux-a2 (implementation spec §6): uxv-1 shipped the configured-disclosure leg
  # but it ran only by hand, so a regression in that leg (or in this job) could
  # merge unnoticed. This job is the isolated, disposable home of that proof:
  # the stock `verify`/`e2e` jobs stay endpoint-free, and nothing is restored
  # here because nothing outside this job consumes the configured `dist`.
  configured-telemetry:
    name: configured telemetry disclosure (isolated)
    runs-on: ubuntu-latest
    # Headroom, not a measurement: this lane repeats the e2e job's stock build
    # and browser install, then runs the configured-disclosure browser legs
    # (each attempt poll is bounded at 15 s). 30 min kills a wedged browser/webServer far short of the 6-hour
    # default ceiling without depending on a single local timing.
    timeout-minutes: 30
    # Least privilege: this lane only reads the repository (audit AR-R2).
    permissions:
      contents: read
    env:
      # The leg must fail rather than retry: a flake here is evidence of a real
      # ordering/privacy problem, not something to paper over (spec §6).
      CI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # Stock workspace build FIRST: the isolated webServer trio also serves the
      # built engine/data-sources preview harnesses. The stock web bundle this
      # produces is then replaced by the configured one below.
      - run: pnpm build

      # Configured web build, package-direct by design (spec §6): a root
      # `pnpm build` here would be a strict-env-mode variable drop plus a stock
      # turbo cache hit, leaving a stock bundle that fails the
      # disclosure-visibility assertions.
      - name: Build the configured web bundle directly
        run: |
          env -u ASSAY_NO_TELEMETRY -u ASSAY_TELEMETRY_TOKEN \
            ASSAY_TELEMETRY_ENDPOINT=https://collector.example.invalid/ingest \
            pnpm --filter @assay/web build

      # Fail-fast build check: report a missing configured endpoint before
      # launching the browser. Without this check an endpoint-free build still
      # fails the disclosure-visibility assertions, but only after their timeout.
      - name: Prove the endpoint is baked into the emitted bundle
        run: |
          if ! grep -rq 'collector.example.invalid' apps/web/dist; then
            echo '::error::apps/web/dist carries no configured endpoint — refusing to start the disclosure leg'
            exit 1
          fi

      # The leg itself: explicit isolated config (outside the stock tests/e2e
      # discovery), zero retries. The spec registers the aborting collector
      # route before any navigation and every intercepted request must be
      # aborted, so no metadata can be delivered.
      - name: Run the configured disclosure leg
        run: pnpm exec playwright test --config tests/visual/playwright.telemetry.config.ts --retries=0

      # Failure-only artefacts; the leg keeps trace/screenshot/video off, so a
      # green run uploads nothing. Same short retention as the e2e lane.
      - name: Upload configured telemetry failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: configured-telemetry-failure-artifacts
          path: |
            test-results
            playwright-report
          retention-days: 5
          if-no-files-found: ignore

  vscode-verify:
    name: VS Code real extension host / offline harness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CI: '1'
      DUCKDB: /tmp/duckdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install VS Code desktop runtime libraries and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0t64 libnss3 libasound2t64 libxss1 libxtst6 \
            libgbm1 libatk-bridge2.0-0t64 libdrm2 libxkbcommon0 libatspi2.0-0t64

      # The version comes from the same helper imported by both harnesses;
      # no independent workflow pin can drift from the runner's cache name.
      - name: Resolve pinned VS Code cache key
        id: vscode-version
        run: |
          node --input-type=module -e "import { PINNED_VSCODE_VERSION, VSCODE_CACHE_PATH } from './apps/vscode/scripts/vscode-runtime.mjs'; console.log('version=' + PINNED_VSCODE_VERSION); console.log('cache=' + VSCODE_CACHE_PATH)" >> "$GITHUB_OUTPUT"

      - name: Cache pinned VS Code runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vscode-version.outputs.cache }}
          key: vscode-${{ runner.os }}-${{ steps.vscode-version.outputs.version }}

      # On a cache miss, provision only the exact pinned test desktop runtime.
      # Both runners independently prefer this canonical cache and CI rejects
      # any fallback to a system or unpinned VS Code installation.
      - name: Provision pinned VS Code runtime
        run: pnpm --filter @assay/vscode run provision:vscode

      - name: Install DuckDB CLI v1.5.5 (sha256-pinned)
        uses: ./.github/actions/install-duckdb

      - name: Test VS Code runtime selection policy
        run: pnpm --filter @assay/vscode run test:runtime

      - name: Run real VS Code dataset e2e
        run: pnpm --filter @assay/vscode run e2e

      - name: Run slice-1 offline exit harness
        run: pnpm --filter @assay/vscode run:spike

      - name: Upload VS Code failure results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-failure-results
          path: apps/vscode/dist/*results.json
          retention-days: 5
          if-no-files-found: ignore
